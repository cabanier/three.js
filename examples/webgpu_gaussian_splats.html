<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - gaussian splats</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - gaussian splats">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_gaussian_splats.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_gaussian_splats.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Gaussian Splats</span>
			</div>

			<small>GPU culling, depth sorting and indirect rendering</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GaussianSplatMesh } from 'three/addons/objects/GaussianSplatMesh.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { VRButton } from 'three/addons/webxr/VRButton.js';

			const SPLAT_COUNT = 8192;

			let camera, cameraRig, scene, renderer, renderPipeline, controls, splats;
			let desktopCameraState;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 50 );
				camera.position.set( 6.5, 4.5, 7.5 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x171a18 );

				cameraRig = new THREE.Group();
				cameraRig.add( camera );
				scene.add( cameraRig );

				renderer = new THREE.WebGPURenderer( {
					antialias: true,
					outputBufferType: THREE.UnsignedByteType,
					multiview: false
				} );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.xr.enabled = true;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				document.body.appendChild( VRButton.createButton( renderer, { optionalFeatures: [ 'webgpu', 'space-warp' ] } ) );

				await renderer.init();
				renderPipeline = new THREE.XRSpaceWarpRenderPipeline( renderer );

				splats = new GaussianSplatMesh( renderer, createSplatData( SPLAT_COUNT ) );
				splats.rotation.x = - 0.15;
				scene.add( splats );

				const grid = new THREE.GridHelper( 14, 28, 0x59615d, 0x303633 );
				grid.position.y = - 2.6;
				scene.add( grid );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.target.set( 0, 0, 0 );
				controls.update();

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( splats, 'splatScale', 0.5, 1.75, 0.01 ).name( 'splat scale' );
				gui.add( splats, 'opacity', 0.1, 1, 0.01 );

				renderer.xr.addEventListener( 'sessionstart', onSessionStart );
				renderer.xr.addEventListener( 'sessionend', onSessionEnd );
				window.addEventListener( 'resize', onWindowResize );
				renderer.setAnimationLoop( animate );

			}

			function createSplatData( count ) {

				const positions = new Float32Array( count * 3 );
				const scales = new Float32Array( count * 3 );
				const rotations = new Float32Array( count * 4 );
				const colors = new Float32Array( count * 4 );
				const center = new THREE.Vector3();
				const centerAhead = new THREE.Vector3();
				const tangent = new THREE.Vector3();
				const normal = new THREE.Vector3();
				const binormal = new THREE.Vector3();
				const ringTangent = new THREE.Vector3();
				const radial = new THREE.Vector3();
				const matrix = new THREE.Matrix4();
				const quaternion = new THREE.Quaternion();
				const color = new THREE.Color();
				const up = new THREE.Vector3( 0, 1, 0 );

				for ( let i = 0; i < count; i ++ ) {

					const t = THREE.MathUtils.seededRandom() * Math.PI * 2;
					const angle = THREE.MathUtils.seededRandom() * Math.PI * 2;
					const radius = 0.32 + THREE.MathUtils.seededRandom() * 0.18;
					const delta = 0.001;

					getKnotPoint( t, center );
					getKnotPoint( t + delta, centerAhead );
					tangent.subVectors( centerAhead, center ).normalize();
					normal.crossVectors( tangent, up );

					if ( normal.lengthSq() < 0.001 ) normal.set( 1, 0, 0 );

					normal.normalize();
					binormal.crossVectors( tangent, normal ).normalize();
					radial.copy( normal ).multiplyScalar( Math.cos( angle ) ).addScaledVector( binormal, Math.sin( angle ) );
					ringTangent.copy( normal ).multiplyScalar( Math.sin( angle ) ).addScaledVector( binormal, - Math.cos( angle ) );

					center.addScaledVector( radial, radius );
					center.addScaledVector( tangent, ( THREE.MathUtils.seededRandom() - 0.5 ) * 0.08 );

					center.toArray( positions, i * 3 );
					scales.set( [
						0.085 + THREE.MathUtils.seededRandom() * 0.045,
						0.045 + THREE.MathUtils.seededRandom() * 0.025,
						0.018 + THREE.MathUtils.seededRandom() * 0.012
					], i * 3 );

					matrix.makeBasis( tangent, ringTangent, radial );
					quaternion.setFromRotationMatrix( matrix );
					quaternion.toArray( rotations, i * 4 );

					color.setHSL( ( t / ( Math.PI * 2 ) + angle * 0.025 ) % 1, 0.68, 0.56 );
					colors.set( [ color.r, color.g, color.b, 0.32 ], i * 4 );

				}

				return { positions, scales, rotations, colors };

			}

			function getKnotPoint( t, target ) {

				const radius = 2.2 + 0.72 * Math.cos( 3 * t );
				target.set(
					radius * Math.cos( 2 * t ),
					0.72 * Math.sin( 3 * t ),
					radius * Math.sin( 2 * t )
				);

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function onSessionStart() {

				desktopCameraState = {
					position: camera.position.clone(),
					quaternion: camera.quaternion.clone(),
					up: camera.up.clone(),
					target: controls.target.clone()
				};

				controls.enabled = false;
				cameraRig.position.set( 0, - 0.4, 8 );
				cameraRig.updateMatrixWorld( true );

			}

			function onSessionEnd() {

				cameraRig.position.set( 0, 0, 0 );
				camera.position.copy( desktopCameraState.position );
				camera.quaternion.copy( desktopCameraState.quaternion );
				camera.up.copy( desktopCameraState.up );
				controls.target.copy( desktopCameraState.target );
				controls.enabled = true;
				controls.update();
				splats.needsUpdate = true;

			}

			function animate() {

				if ( renderer.xr.isPresenting === true ) {

					renderer.xr.updateCamera( camera );
					splats.update( renderer.xr.getCamera() );

				} else {

					controls.update();
					splats.update( camera );

				}

				if ( renderer.xr.isPresenting === true ) {

					renderPipeline.render( scene, camera );

				} else {

					renderer.render( scene, camera );

				}

			}

		</script>
	</body>
</html>
